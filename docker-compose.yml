version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    container_name: geoapi-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_TYPE=sqlite
      - DB_DATABASE=/app/data/geoapi.sqlite
      - DB_SYNCHRONIZE=false
      - API_KEY_HEADER=x-api-key
      - SWAGGER_ENABLED=true
    volumes:
      - geoapi-data:/app/data
    networks:
      - geoapi-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: geoapi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - geoapi-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  geoapi-data:
    driver: local

networks:
  geoapi-network:
    driver: bridge
